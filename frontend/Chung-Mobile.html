<div class="app"><header><div class="topline"><a class="brand" href="#" aria-label="Về tổng quan">chung<span>●</span></a><span class="demo">BẢN MẪU</span><button class="avatar me" data-action="profile" aria-label="Thông tin bản mẫu">B</button></div><div class="scope-tabs" aria-label="Phạm vi xem"><button class="selected" data-scope="group" data-action="home">Theo nhóm</button><button data-scope="contacts" data-action="contacts">Với từng người</button></div><button class="group-picker" data-action="groups"><span class="group-icon">✳</span><span><strong>Hội mình đi đâu?</strong><small>8 thành viên · Đổi nhóm (3)</small></span><span class="chevron">⌄</span></button></header>
<main id="main"></main><nav aria-label="Điều hướng chính" id="nav"></nav></div>
<dialog id="sheet"><div class="sheet-top"><span class="handle"></span><button class="close" aria-label="Đóng">×</button></div><div id="sheet-content"></div></dialog><div id="toast" role="status"></div><script>(function (root) {
  function split(amount, ids) {
    if (!Number.isSafeInteger(amount) || amount <= 0 || !ids.length || new Set(ids).size !== ids.length) throw Error('Nhập số tiền nguyên dương và chọn ít nhất một người.');
    return ids.map((id, i) => ({ id, amount: Math.floor(amount / ids.length) + (i < amount % ids.length ? 1 : 0) }));
  }
  function balances(bills, payments, count) {
    const result = Array(count).fill(0);
    bills.filter(b => b.source === 'personal').forEach(b => { result[b.payer] += b.amount; split(b.amount, b.ids).forEach(s => result[s.id] -= s.amount); });
    payments.filter(p => p.status === 'confirmed').forEach(p => { result[p.from] += p.amount; result[p.to] -= p.amount; });
    return result;
  }
  function transfers(balance) {
    const debtors = balance.map((n,id) => ({id, amount: -n})).filter(x => x.amount > 0);
    const creditors = balance.map((n,id) => ({id, amount: n})).filter(x => x.amount > 0);
    const result = []; let i=0, j=0;
    while (i < debtors.length && j < creditors.length) { const amount=Math.min(debtors[i].amount,creditors[j].amount); result.push({from:debtors[i].id,to:creditors[j].id,amount}); debtors[i].amount-=amount; creditors[j].amount-=amount; if(!debtors[i].amount)i++; if(!creditors[j].amount)j++; }
    return result;
  }
  function directTransfers(bills, payments, count) {
    const pairs = Array.from({length:count}, () => Array(count).fill(0));
    bills.filter(b => b.source === 'personal').forEach(b => {
      split(b.amount,b.ids).forEach(s => { if(s.id !== b.payer){pairs[s.id][b.payer]+=s.amount;pairs[b.payer][s.id]-=s.amount;} });
    });
    payments.filter(p=>p.status==='confirmed').forEach(p=>{pairs[p.from][p.to]-=p.amount;pairs[p.to][p.from]+=p.amount;});
    const result=[];
    for(let i=0;i<count;i++)for(let j=i+1;j<count;j++){
      const n=pairs[i][j];if(n)result.push({from:n>0?i:j,to:n>0?j:i,amount:Math.abs(n)});
    }
    return result;
  }
  function personalDebts(bills, payments, count, id) {
    const pairs=directTransfers(bills,payments,count);
    const owed=pairs.filter(t=>t.from===id), receivable=pairs.filter(t=>t.to===id);
    return {owed,receivable,owe:owed.reduce((sum,t)=>sum+t.amount,0),receive:receivable.reduce((sum,t)=>sum+t.amount,0)};
  }
  function contactDebts(groups, userId) {
    const contacts=new Map();
    for(const g of groups){
      const me=g.memberIds.indexOf(userId);if(me<0)continue;
      const pairs=directTransfers(g.state.bills,g.state.payments,g.memberIds.length);
      g.memberIds.forEach((id,index)=>{
        if(id===userId)return;
        if(!contacts.has(id))contacts.set(id,{id,name:g.state.names[index],owe:0,receive:0,groups:[]});

y" data-action="close-period" ${ready?'':'disabled'}>Mô phỏng quản trị chốt kỳ</button><button class="secondary spaced" data-action="period-history">Các kỳ đã chốt (${closedPeriods.length})</button>`);

 show(`<h2 class="sheet-title">Tiền này từ đâu?</h2><p class="sheet-sub">Số dư ròng của bạn · Toàn bộ lịch sử</p><div class="money ${current<0?'orange':''}">${signed(current)}</div><div class="note">Tiền đã ứng − phần của bạn + tiền đã trả − tiền đã nhận. Chỉ tính thanh toán được xác nhận; quỹ nằm riêng.</div><div class="detail-list">${rows.map(r=>r.kind==='bill'?`<button class="explain-row" data-action="bill" data-id="${r.id}"><span><strong>${esc(bills.find(b=>b.id===r.id).title)}</strong><small>Ứng ${fmt(r.paid)} · Phần mình ${fmt(r.share)}</small></span><strong>${signed(r.amount)}</strong></button>`:`<div class="explain-row"><span><strong>${r.amount>0?'Bạn đã trả':'Bạn đã nhận'}</strong><small>Thanh toán đã xác nhận</small></span><strong>${signed(r.amount)}</strong></div>`).join('')||'<p class="empty">Chưa có khoản phát sinh.</p>'}<div class="row"><strong>Tổng các dòng</strong><strong>${signed(rows.reduce((s,r)=>s+r.amount,0))}</strong></div></div><h3 class="section-heading">Nếu giữ người nhận gốc</h3>${transferList(raw)}<h3 class="section-heading">Nếu bù trừ toàn nhóm</h3>${transferList(net)}<div class="note">Hai cách giữ nguyên số dư ròng từng người. Bù trừ có thể đổi người nhận để giảm chuyển qua lại. Nhóm đang dùng: <strong>${policy.netting?'Bù trừ toàn nhóm':'Giữ người nhận gốc'}</strong>.</div><button class="secondary" data-action="rules">Xem quy ước bù trừ</button>`);
}
function transferList(ts){return `<div class="detail-list">${ts.map(t=>`<div class="row"><span>${names[t.from]} → ${names[t.to]}</span><strong>${fmt(t.amount)}</strong></div>`).join('')||'<p class="empty">Không còn khoản cần chuyển.</p>'}</div>`;}
function rulesView(){show(`<h2 class="sheet-title">Quy ước của hội</h2><p class="sheet-sub">Phiên bản ${policy.version} · Cùng thống nhất trước khi chia</p><div class="detail-list"><div class="row"><span>Dùng quỹ</span><strong>Chỉ khi đủ ${names.length} người</strong></div><div class="row"><span>Cách chia hiện tại</span><strong>Chia đều</strong></div><div class="row"><span>Tiền quỹ nhận</span><strong>Thủ quỹ xác nhận</strong></div><div class="row"><span>Trả nợ</span><strong>Người nhận xác nhận</strong></div><div class="row"><span>Chu kỳ</span><strong>${periodName(policy.frequency)}</strong></div><div class="row"><span>Bù trừ</span><strong>${policy.netting?'Toàn nhóm':'Giữ người nhận gốc'}</strong></div></div><div class="note">Điều kiện đủ người mới dùng quỹ được giữ cố định. Thay đổi quy ước không sửa lại bill hay kỳ đã chốt.</div>${proposal?`<div class="pending-card"><h3>${proposal.approved?'Đã đủ đồng ý · Chờ kỳ sau':'Đề xuất đang chờ đồng ý'}</h3><p>${periodName(proposal.values.frequency)} · ${proposal.values.netting?'Bù trừ toàn nhóm':'Giữ người nhận gốc'}<br>${proposal.votes.length}/${names.length} thành viên đồng ý.</p>${!proposal.approved?`<button class="secondary" data-action="vote-policy">Xem và thử bước đồng ý</button>`:''}<button class="text-btn" data-action="cancel-policy">Hủy đề xuất mẫu</button></div>`:`<button class="primary" data-action="edit-policy">Đề xuất thay đổi</button>`}<h3 class="section-heading">Lịch sử hiệu lực</h3>${policyHistory.map(h=>`<p class="note">v${h.version} · Từ kỳ ${h.period}: ${periodName(h.frequency)}, ${h.netting?'bù trừ toàn nhóm':'giữ người nhận gốc'}.</p>`).join('')||'<p class="sub">v1 · Quy ước ban đầu của nhóm minh họa.</p>'}<p class="footer-note">Ngưỡng ${names.length}/${names.length} đồng ý là đề xuất để duyệt UX.</p>`);}
function editPolicy(){show(`<h2 class="sheet-title">Đề xuất quy ước</h2><p class="sheet-sub">Xem thử vai trò quản trị · Có hiệu lực từ kỳ sau</p><form id="policy-form"><label class="field">Chu kỳ chốt<select name="frequency"><option value="weekly">Hằng tuần</option><option value="monthly">Hằng tháng</option></select></label><label class="check-line"><input type="checkbox" name="netting"> Bù trừ đổi người nhận trong cả nhóm</label><div class="note">Tắt lựa chọn này vẫn cộng dồn và bù hai chiều giữa cùng một cặp. Nhóm phải đồng ý trước khi thay đổi.</div><button class="primary" type="submit">Tạo đề xuất để cả nhóm xem</button></form>`);const f=$('#policy-form');f.frequency.value=policy.frequency;f.netting.checked=policy.netting;f.onsubmit=e=>{e.preventDefault();if(f.frequency.value===policy.frequency&&f.netting.checked===policy.netting){toast('Bạn chưa thay đổi quy ước.');return;}proposal={values:{frequency:f.frequency.value,netting:f.netting.checked},votes:[],approved:false};rulesView();};}
function votePolicy(){if(!proposal)return rulesView();show(`<h2 class="sheet-title">Cùng duyệt quy ước</h2><p class="sheet-sub">${periodName(proposal.values.frequency)} · ${proposal.values.netting?'Bù trừ toàn nhóm':'Giữ người nhận gốc'}</p><div class="note">Chọn thành viên để mô phỏng họ đã đồng ý. Trong ứng dụng thật, mỗi người tự xác nhận bằng tài khoản của mình.</div>${names.map((n,i)=>`<button class="transaction" data-action="policy-vote" data-id="${i}" ${proposal.votes.includes(i)?'disabled':''}>${avatar(i)}<span><strong>${n}</strong><small>${proposal.votes.includes(i)?'Đã đồng ý':'Thử bước đồng ý'}</small></span><span class="right">${proposal.votes.includes(i)?'✓':'→'}</span></button>`).join('')}<p class="footer-note">${proposal.votes.length}/${names.length} đồng ý · Chưa sửa số dư</p><button class="secondary" data-action="rules">Về quy ước nhóm</button>`);}
function feedbackForm(id,guest=false){const b=bills.find(b=>b.id===id);show(`<h2 class="sheet-title">Báo khoản chia sai</h2><p class="sheet-sub">${esc(b.title)}${guest?' · Vai trò khách được mời':''}</p><form id="feedback-form"><label class="field">Bạn muốn nhóm kiểm tra điều gì?<textarea name="reason" required maxlength="500" placeholder="Ví dụ: Mình không tham gia bữa này."></textarea></label><p class="error" id="feedback-error" role="alert"></p><div class="note">Phản hồi chưa tự thay đổi số tiền. Nhóm cần xử lý trước khi chốt kỳ.</div><button class="primary" type="submit">Gửi phản hồi${guest?' mẫu':''}</button></form>`);$('#feedback-form').onsubmit=e=>{e.preventDefault();if(guest&&invitation.status!=='active'){toast('Link không còn hiệu lực.');guestView();return;}const reason=e.target.reason.value.trim();if(!reason){$('#feedback-error').textContent='Hãy ghi lý do cần kiểm tra.';return;}feedback.unshift({id:++feedbackSequence,billId:id,reason,guest,status:'open',reply:''});close();render();toast('Đã ghi phản hồi mẫu. Số dư giữ nguyên.');};}
function feedbackPanel(id){const fs=feedback.filter(f=>f.billId===id);return `<div class="feedback-section"><h3>Phản hồi của thành viên</h3>${fs.map(f=>`<div class="note"><strong>${f.guest?'Khách được mời':'Bạn'} · ${f.status==='open'?'Đang mở':'Đã xử lý'}</strong><p>${esc(f.reason)}</p>${f.reply?`<p><strong>Trả lời:</strong> ${esc(f.reply)}</p>`:`<button class="text-btn" data-action="resolve-feedback" data-id="${f.id}">Thử bước người phụ trách xử lý</button>`}</div>`).join('')||'<p class="sub">Chưa có phản hồi.</p>'}<button class="secondary spaced" data-action="feedback" data-id="${id}">Báo khoản chia sai</button></div>`;}
function resolveFeedback(id){const f=feedback.find(f=>f.id===id);show(`<h2 class="sheet-title">Xử lý phản hồi</h2><p class="sheet-sub">Xem thử vai trò người phụ trách bill</p><div class="note">${esc(f.reason)}</div><form id="resolve-form"><label class="field">Giải thích vì sao giữ nguyên bill<textarea name="reply" required maxlength="500" placeholder="Ghi kết quả kiểm tra để thành viên hiểu."></textarea></label><p class="error" id="resolve-error" role="alert"></p><div class="note">Bản mẫu minh họa nhánh giữ nguyên bill. Nếu bill cần sửa tiền, giữ phản hồi mở; chức năng điều chỉnh có lịch sử được đặc tả trong FRS.</div><button class="primary" type="submit">Mô phỏng giữ nguyên và trả lời</button><button class="secondary spaced" type="button" data-action="close">Giữ mở để kiểm tra thêm</button></form>`);$('#resolve-form').onsubmit=e=>{e.preventDefault();const reply=e.target.reply.value.trim();if(!reply){$('#resolve-error').textContent='Cần ghi giải thích.';return;}f.reply=reply;f.status='resolved';billDetail(f.billId);render();};}
function blockerView(){show(`<h2 class="sheet-title">Các khoản đang chờ</h2><p class="sheet-sub">Xử lý từng khoản trước khi chốt kỳ.</p>${openFeedback().map(f=>`<button class="transaction" data-action="bill" data-id="${f.billId}"><span><strong>${esc(bills.find(b=>b.id===f.billId).title)}</strong><small>Phản hồi: ${esc(f.reason)}</small></span><span class="right">→</span></button>`).join('')}${pendingRows()}${pendingContributions.length?'<button class="secondary spaced" data-action="open-fund">Mở quỹ để xác nhận khoản nộp</button>':''}<button class="secondary spaced" data-action="period">Quay lại chốt kỳ</button>`);}
function notificationView(){show(`<h2 class="sheet-title">Thông báo của bạn</h2><p class="sheet-sub">Tổng kết và nhắc tiền theo kỳ</p><label class="check-line"><input id="notify-toggle" type="checkbox" ${notificationEnabled?'checked':''}> Nhận lời nhắc thanh toán</label><div class="note">Bản mẫu chỉ tạo nội dung trong hộp thư này, không gửi push, SMS hay tin nhắn ra ngoài.</div><button class="primary" data-action="preview-reminder">Tạo bản nhắc theo số dư hiện tại</button>${notifications.map(n=>`<div class="pending-card"><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p><small>Số liệu tại lúc tạo · Chưa gửi ra ngoài</small></div>`).join('')||'<p class="empty">Chưa có thông báo mẫu.</p>'}`);$('#notify-toggle').onchange=e=>{notificationEnabled=e.target.checked;toast(notificationEnabled?'Đã bật nhắc tiền trong mẫu.':'Đã tắt lời nhắc.');};}
function previewReminder(){if(!notificationEnabled){toast('Bạn đã tắt lời nhắc thanh toán.');return;}const owe=totalsFor(0).owe;if(!owe){toast('Bạn không còn khoản cần trả. Không tạo nhắc tiền.');return;}if(payments.some(p=>p.status==='pending'&&p.from===0)){toast('Khoản chuyển đang chờ xác nhận. Không nhắc chuyển lần nữa.');return;}const key=period.number+':'+owe+':'+policy.version;if(notifications.some(n=>n.key===key)){toast('Bản nhắc này đã có trong hộp thư.');return;}notifications.unshift({key,title:'Nhắc tiền kỳ '+period.number,text:'Bạn còn cần trả '+fmt(owe)+'. Mở Công nợ để xem người nhận và lý do.'});notificationView();render();}
const flowActions={period:periodView,'close-period':closePeriod,'period-history':periodHistory,'period-detail':b=>periodDetail(+b.dataset.id),explain,rules:rulesView,'edit-policy':editPolicy,'vote-policy':votePolicy,'policy-vote':b=>{if(!proposal)return;const id=+b.dataset.id;if(!proposal.votes.includes(id))proposal.votes.push(id);proposal.approved=proposal.votes.length===names.length;votePolicy();},'cancel-policy':()=>{proposal=null;rulesView();},feedback:b=>feedbackForm(+b.dataset.id),'resolve-feedback':b=>resolveFeedback(+b.dataset.id),'open-blockers':blockerView,'open-fund':()=>{close();go('fund');},notifications:notificationView,'preview-reminder':previewReminder};
</script><script>const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('vi-VN').format(n) + ' ₫';
let names = ['Bạn','Bình','An','Chi','Dũng','Hà','Linh','Huy'];
let groupName = 'Hội mình đi đâu?';
const colors = ['#dde8cd','#eddfcd','#dbe8ed','#eaddea','#e7e6ce','#eedccc','#dfe3ee','#e5dfd5'];
const paths = {home:'M3 10 12 3l9 7v10H15v-6H9v6H3Z',wallet:'M3 6h16v14H3V6Zm0 0V4h14v2m-2 6h6v5h-6Zm2 2h1',debt:'M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4',history:'M4 5v5h5M4 10a8 8 0 1 1 1 8m7-12v6l4 2',plus:'M12 5v14M5 12h14',food:'M5 3v7m3-7v7M3 3v5a3 3 0 0 0 6 0V3M6 11v10M18 21V3c-4 3-4 8 0 9',trip:'M3 7h18v13H3ZM8 7V4h8v3M7 7v13m10-13v13',arrow:'M5 12h14m-6-6 6 6-6 6',check:'m5 12 4 4L19 6',upload:'M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6',users:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3m17 0v-3a4 4 0 0 0-3-4M13 3a4 4 0 0 1 0 8M12 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',coffee:'M4 8h12v7a5 5 0 0 1-10 0V8m10 1h2a3 3 0 0 1 0 6h-2M7 3v2m4-2v2M3 21h16'};
const icon = n => `<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[n]||paths.wallet}"/></svg>`;
const avatar = i => `<span class="avatar" style="background:${colors[i%colors.length]}">${esc(names[i].slice(0,1))}</span>`;
let all = names.map((_,i)=>i);
let bills = [
 {id:4,title:'Bữa sáng Chủ nhật',amount:300000,ids:[0,2],payer:0,source:'personal',date:'Hôm nay · 08:00',icon:'food'},
 {id:1,title:'Lẩu tối thứ Bảy',amount:1000000,ids:[0,1,2,3,4],payer:1,source:'personal',date:'Hôm nay · 19:30',icon:'food'},
 {id:2,title:'Cà phê cả hội',amount:400000,ids:all,payer:2,source:'advance',date:'Hôm qua · 10:15',icon:'coffee'},
 {id:3,title:'Picnic cuối tuần',amount:800000,ids:all,payer:0,source:'fund',date:'Thứ Sáu · 08:00',icon:'trip'}
];
let payments=[], deposits=4000000, refunded=0, page='home', debtTab='mine', pendingContributions=[], fundEvents=[];
let draft=null, receiptUrl=null, toastTimer;
// shortcut: dữ liệu chỉ nằm trong phiên xem thử; thêm lưu trữ và phân quyền khi triển khai ứng dụng thật.
const balances = () => Money.balances(bills,payments,names.length);
const fund = () => {const cash=deposits-bills.filter(b=>b.source==='fund').reduce((a,b)=>a+b.amount,0)-refunded; const owed=bills.filter(b=>b.source==='advance').reduce((a,b)=>a+b.amount,0)-refunded;return {cash,owed,available:cash-owed};};
function toast(message){$('#toast').textContent=message;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',3200);}
function show(html){$('#sheet-content').innerHTML=html;const heading=$('#sheet-content h2');if(heading){heading.id='sheet-heading';heading.tabIndex=-1;$('#sheet').setAttribute('aria-labelledby','sheet-heading');}if(!$('#sheet').open)$('#sheet').showModal();if(heading)heading.focus({preventScroll:true});$('#sheet').scrollTop=0;}

function fundCard(){const f=fund();return `<section class="fund-card"><div class="card-label">${icon('wallet')} Quỹ chung khả dụng</div><div class="money">${fmt(f.available).replace(' ₫',' <span>₫</span>')}</div><p class="sub">${f.owed?"Đã dành "+fmt(f.owed)+" hoàn lại tiền ứng":"Không có khoản ứng cần hoàn"}</p><div class="card-bottom"><span class="status-dot"></span> Cả nhóm cùng xem được<button data-action="contribute">+ Nộp quỹ</button></div></section>`;}
function billRow(b){return `<button class="transaction" data-action="bill" data-id="${b.id}"><span class="icon-tile">${icon(b.icon)}</span><span><strong>${esc(b.title)}</strong><small>${b.ids.length} người · ${b.source==='fund'?'Chi từ quỹ':names[b.payer]+' trả trước'}</small></span><span class="right"><strong>${fmt(b.amount)}</strong><span class="badge ${b.source==='personal'?'amber':''}">${b.source==='personal'?'Chia riêng':b.source==='advance'?(b.refunded?'Đã hoàn ứng':'Quỹ cần hoàn'):'Quỹ chung'}</span></span></button>`;}

function home(){const b=balances()[0], totals=Money.personalDebts(bills,payments,names.length,0);return `<div class="heading compact"><div><p class="sub">Chào bạn,</p><h2>Chuyện tiền của nhóm</h2></div><span class="sub">08 thg 11</span></div>${fundCard()}<div class="summary"><button class="stat" data-action="debts" style="text-align:left"><span class="label">Tổng nợ ${icon('arrow')}</span><strong class="orange">${fmt(totals.owe)}</strong><small>${totals.owe?'Nợ '+totals.owed.map(t=>names[t.to]).join(', '):'Không nợ ai'}</small></button><button class="stat" data-action="debts" style="text-align:left"><span class="label">Tổng cần thu ${icon('arrow')}</span><strong>${fmt(totals.receive)}</strong><small>${totals.receive?totals.receivable.map(t=>names[t.from]).join(', ')+' đang nợ bạn':'Không ai đang nợ bạn'}</small></button></div><div class="action-row"><button class="primary" data-action="add">${icon('plus')} Thêm bill</button><button class="secondary" data-action="debts">${'Thanh toán nợ'}</button></div>${periodBanner()}<div class="heading"><h3>Khoản chi gần đây</h3><button class="text-btn" data-action="activity">Xem tất cả →</button></div>${bills.slice(0,3).map(billRow).join('')}<div class="home-end"><div class="people-strip">${[0,1,2,3].map(avatar).join('')}<small>+${names.length-4} người bạn</small></div><button class="text-btn" data-action="members">Cả nhóm →</button></div><p class="footer-note">Đi vui, chia rõ. Cùng nhau là được.</p>`;}
function fundEventRows(){return fundEvents.map(e=>`<div class="transaction"><span class="icon-tile">${icon('wallet')}</span><span><strong>${esc(e.title)}</strong><small>Đã xác nhận · Vừa xong</small></span><strong class="right">${e.amount>0?'+':'−'} ${fmt(Math.abs(e.amount))}</strong></div>`).join('');}
function fundPage(){const f=fund();return `<div class="page-title"><h2>Quỹ của cả hội</h2><p class="sub">Một khoản chung, mọi người cùng rõ.</p></div><div style="height:14px"></div>${fundCard()}<div class="detail-list"><div class="row"><span>Tiền đang có trong quỹ</span><strong>${fmt(f.cash)}</strong></div><div class="row"><span>Cần hoàn tiền ứng</span><strong class="orange">${f.owed?"− ":""}${fmt(f.owed)}</strong></div><div class="row"><span class="value">Còn có thể chi</span><strong>${fmt(f.available)}</strong></div></div><div class="note">${icon('users')} Chỉ dùng quỹ cho hoạt động có <strong>đủ ${names.length} thành viên</strong>. Đi ít người hơn? Chia riêng cho những người tham gia.</div>${bills.filter(b=>b.source==='advance'&&!b.refunded).map(b=>`<div class="pending-card"><h3>Hoàn tiền ứng cho ${esc(names[b.payer])}</h3><p>${esc(b.title)} · ${fmt(b.amount)}. Số tiền này đã được giữ lại trong quỹ.</p><button class="secondary" data-action="refund" data-id="${b.id}">Xem khoản cần hoàn</button></div>`).join('')}${pendingContributions.map((p,i)=>`<div class="pending-card"><h3>Bạn nộp ${fmt(p.amount)} · Chờ xác nhận</h3><p>Quỹ sẽ tăng sau khi thủ quỹ xác nhận nhận tiền.</p><button class="secondary" data-action="verify-contribution" data-id="${i}">Thử bước thủ quỹ xác nhận</button></div>`).join('')}<div class="heading"><h3>Thu chi của quỹ</h3><span class="sub">Tháng 11</span></div>${fundEventRows()}${bills.filter(b=>b.source!=='personal').map(billRow).join('')}<div class="transaction"><span class="icon-tile">${icon('wallet')}</span><span><strong>Góp quỹ tháng 11</strong><small>Khoản góp quỹ ban đầu</small></span><span class="right"><strong>+ ${fmt(4000000)}</strong><small>500.000 ₫ / người</small></span></div>`;}
function debtPeople(rows,owing){return `<h3 class="spaced">${owing?'Bạn đang nợ ai':'Ai đang nợ bạn'}</h3>${rows.map(t=>`<div class="transaction">${avatar(owing?t.to:t.from)}<span><strong>${esc(names[owing?t.to:t.from])}</strong><small>${owing?'Bạn nợ người này':'Người này đang nợ bạn'}</small></span><strong class="right ${owing?'orange':''}">${fmt(t.amount)}</strong></div>`).join('')||`<div class="empty">${owing?'Bạn không nợ ai.':'Không ai đang nợ bạn.'}</div>`}`;}
function debtPage(){const b=balances(),ts=currentTransfers(), totals=Money.personalDebts(bills,payments,names.length,0);return `<div class="page-title"><h2>Công nợ</h2><p class="sub">Cộng dồn các bữa, bù trừ cho nhẹ.</p></div><div class="pill-tabs"><button class="${debtTab==='mine'?'selected':''}" data-action="debt-tab" data-tab="mine">Của bạn</button><button class="${debtTab==='all'?'selected':''}" data-action="debt-tab" data-tab="all">Cả nhóm</button></div>${debtTab==='mine'?`<div class="summary"><div class="stat"><span class="label">Tổng nợ</span><strong class="orange">${fmt(totals.owe)}</strong></div><div class="stat"><span class="label">Tổng cần thu</span><strong>${fmt(totals.receive)}</strong></div></div><div class="note">Theo từng người, trước bù trừ toàn nhóm. Số dư ròng: <strong>${signed(b[0])}</strong>.</div>${debtPeople(totals.owed,true)}${debtPeople(totals.receivable,false)}<button class="secondary" data-action="explain">Vì sao có số tiền này? →</button>${pendingRows()}<p class="section-eyebrow">${policy.netting?'ĐỀ XUẤT SAU BÙ TRỪ':'THANH TOÁN THEO NGƯỜI NHẬN GỐC'}</p>${ts.filter(t=>t.from===0||t.to===0).map(t=>`<button class="transaction" data-action="transfer" data-to="${t.to}" data-from="${t.from}" data-amount="${t.amount}">${avatar(t.from===0?t.to:t.from)}<span><strong>${t.from===0?'Bạn → '+names[t.to]:names[t.from]+' → Bạn'}</strong><small>${t.from===0?'Chạm để xem thanh toán':'Khoản bạn được nhận'}</small></span><span class="right"><strong>${fmt(t.amount)}</strong><small>Chi tiết →</small></span></button>`).join('')||'<div class="empty">Mọi khoản của bạn đã cân bằng ✨</div>'}`:`<div class="note">Số dư ròng: âm là cần trả, dương là được nhận. Quỹ được theo dõi riêng.</div>${b.map((n,i)=>`<div class="transaction">${avatar(i)}<span><strong>${esc(names[i])}</strong><small>${n<0?'Cần trả':n>0?'Được nhận':'Số dư ròng bằng 0'}</small></span><strong class="right ${n<0?'orange':''}">${signed(n)}</strong></div>`).join('')}<button class="secondary spaced" data-action="explain">Xem cách bù trừ</button>`}${periodBanner()}<div class="note">Quy ước hiện tại: ${policy.netting?'bù trừ toàn nhóm':'giữ người nhận gốc'}. Chuyển tiền được trừ nợ sau khi người nhận xác nhận.</div>`;}
function activity(){return `<div class="page-title"><h2>Hoạt động</h2><p class="sub">Mọi khoản, mọi người đều xem được.</p></div>${openFeedback().length?`<button class="period-banner" data-action="open-blockers"><span><strong>${openFeedback().length} phản hồi cần xử lý</strong><small>Xem trước khi chốt kỳ</small></span><span>→</span></button>`:''}${pendingRows()}${fundEventRows()}${payments.filter(p=>p.status==='confirmed').map(p=>`<div class="transaction"><span class="icon-tile">${icon('check')}</span><span><strong>${esc(names[p.from])} đã trả ${esc(names[p.to])}</strong><small>Đã xác nhận · Vừa xong</small></span><strong class="right">${fmt(p.amount)}</strong></div>`).join('')}<p class="section-eyebrow">CÁC BILL CỦA NHÓM</p>${bills.map(billRow).join('')}<div class="note">Các nội dung trong bản mẫu chỉ hiển thị trên thiết bị này. Tải lại trang để trở về dữ liệu minh họa ban đầu.</div>`;}
function render(){ document.body.dataset.view=page;$('#nav').hidden=page==='contacts';document.querySelector('.group-picker').hidden=page==='contacts';document.querySelectorAll('[data-scope]').forEach(b=>{const active=b.dataset.scope===(page==='contacts'?'contacts':'group');b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active));}); $('#main').innerHTML=({home,fund:fundPage,debts:debtPage,activity,contacts:()=>contactsPage()}[page])();$('#nav').innerHTML=[['home','home','Tổng quan'],['fund','wallet','Quỹ nhóm'],['debts','debt','Công nợ'],['activity','history','Hoạt động']].map(([id,ic,label])=>`<button data-action="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span class="nav-icon">${icon(ic)}</span>${label}</button>`).join('');}
function members(){show(`<h2 class="sheet-title">${esc(groupName)}</h2><p class="sheet-sub">${names.length} người bạn · Cùng ăn, cùng chơi, cùng rõ</p><div class="action-row"><button class="secondary" data-action="rules">Quy ước nhóm</button><button class="primary" data-action="invite">Mời qua link</button></div>${names.map((n,i)=>`<div class="transaction">${avatar(i)}<span><strong>${n}</strong><small>${i===2?'Thủ quỹ':i===1?'Trưởng nhóm':'Thành viên'}</small></span><span class="right badge">Đang tham gia</span></div>`).join('')}<div class="note">Tên và vai trò là dữ liệu minh họa cho bản thiết kế.</div>`);}
function addBill(data=null){draft=null;if(receiptUrl&&!data){URL.revokeObjectURL(receiptUrl);receiptUrl=null;}show(`<h2 class="sheet-title">Thêm một cuộc vui</h2><p class="sheet-sub">Chọn người tham gia, phần chia để chung lo.</p><form id="bill-form"><label class="upload">${icon('upload')}<span>Ảnh hóa đơn <small>(không bắt buộc)</small><input id="receipt" type="file" accept="image/*" aria-label="Chọn ảnh hóa đơn"></span></label><label class="field">Tên khoản chi<input name="title" placeholder="Ví dụ: Bún bò sáng Chủ nhật" maxlength="70" required></label><label class="field">Tổng tiền (₫)<input class="amount" name="amount" type="number" inputmode="numeric" min="1" max="100000000" step="1" placeholder="0" required></label><div class="heading"><h3>Ai tham gia?</h3><button type="button" class="text-btn" data-action="select-all">Chọn cả nhóm</button></div><div class="member-grid">${names.map((n,i)=>`<label class="member-choice"><input type="checkbox" name="member" value="${i}" ${i<5?'checked':''}>${avatar(i)}${n}</label>`).join('')}</div><div id="split-hint" class="split-preview" aria-live="polite"></div><label class="field">Nguồn thanh toán<select name="source"><option value="personal">Cá nhân trả trước · Chia riêng</option></select></label><label class="field" id="payer-field">Ai đã trả tiền?<select name="payer">${names.map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select></label><p id="fund-hint" class="note"></p><p id="bill-error" class="error" role="alert"></p><button class="primary" type="submit">Xem phần chia ${icon('arrow')}</button><p class="footer-note">Ảnh chỉ xem trong phiên này. Nhập số tiền để chia.</p></form>`);const form=$('#bill-form');form.addEventListener('input',updateSplit);form.addEventListener('change',updateSplit);form.addEventListener('submit',reviewBill);if(data){form.elements.namedItem('title').value=data.title;form.amount.value=data.amount;form.querySelectorAll('[name=member]').forEach(b=>b.checked=data.ids.includes(+b.value));form.payer.value=data.payer;}updateSplit();if(data){form.source.value=data.source;updateSplit();}}

function updateSplit(){const f=$('#bill-form'), ids=[...f.querySelectorAll('[name=member]:checked')].map(x=>+x.value), amount=Number(f.amount.value), full=ids.length===names.length;const old=f.source.value;const opts=full?'<option value="fund">Chi trực tiếp từ quỹ</option><option value="advance">Cá nhân ứng cho quỹ</option>':'<option value="personal">Cá nhân trả trước · Chia riêng</option>';if(f.source.dataset.full!==String(full)){f.source.innerHTML=opts;f.source.dataset.full=String(full);f.source.value=full?'fund':'personal';}else f.source.value=old;$('#payer-field').classList.toggle('hidden',f.source.value==='fund');$('#split-hint').innerHTML=`<span>${ids.length}/${names.length} người tham gia</span><strong>${ids.length&&amount>0?fmt(Math.floor(amount/ids.length)):'—'} <small style="font-size:10px;font-weight:400">/ người</small></strong>`;$('#fund-hint').textContent=full?(f.source.value==='personal'?'Bạn đang chọn chia riêng dù cả nhóm có mặt.':'Đủ cả nhóm: có thể dùng quỹ. Quỹ khả dụng '+fmt(fund().available)+'.'):`Chưa đủ ${names.length} người: khoản này chia riêng, không trừ quỹ.`;}
function reviewBill(e){e.preventDefault();const f=e.target;const ids=[...f.querySelectorAll('[name=member]:checked')].map(x=>+x.value);const amount=Number(f.amount.value);try{Money.split(amount,ids);if(!f.elements.namedItem("title").value.trim())throw Error('Bạn hãy đặt tên khoản chi.');if(amount>100000000)throw Error('Bản mẫu hỗ trợ khoản chi tối đa 100 triệu đồng.');if(f.source.value!=='personal'&&amount>fund().available)throw Error('Quỹ khả dụng chưa đủ. Hãy nộp thêm quỹ trước khi ghi nhận khoản này.');const file=$('#receipt').files[0];if(file&&(!file.type.startsWith('image/')||file.size>10*1024*1024))throw Error('Chọn ảnh hóa đơn dưới 10 MB.');if(file)receiptUrl=URL.createObjectURL(file);draft={id:Date.now(),title:f.elements.namedItem("title").value.trim(),amount,ids,payer:+f.payer.value,source:f.source.value,period:period.number,date:'Kỳ '+period.number+' · Vừa xong',icon:'food',receipt:receiptUrl};show(`<h2 class="sheet-title">Kiểm tra phần chia</h2><p class="sheet-sub">${esc(draft.title)} · ${ids.length} người</p><div class="hero-number"><small>Tổng hóa đơn</small><div class="money">${fmt(amount)}</div></div><div class="note">${draft.source==='fund'?'Chi từ quỹ chung. Không tạo công nợ cá nhân.':draft.source==='advance'?names[draft.payer]+' ứng trước. Quỹ ghi nhận khoản cần hoàn; tiền quỹ chưa bị trừ.':names[draft.payer]+' trả trước. Các phần dưới đây được cộng vào số dư nhóm.'}</div><div class="detail-list">${Money.split(amount,ids).map(s=>`<div class="row"><span>${esc(names[s.id])}</span><strong>${fmt(s.amount)}</strong></div>`).join('')}</div>${amount%ids.length?'<p class="sub">Phần lẻ 1 ₫ được chia lần lượt theo thứ tự thành viên.</p>':''}${receiptUrl?`<img class="receipt-image" src="${receiptUrl}" alt="Ảnh hóa đơn đã chọn">`:''}<button class="primary" style="margin-top:20px" data-action="save-bill">${icon('check')} Xác nhận thêm bill</button><button class="secondary" style="margin-top:10px" data-action="edit-draft">Quay lại chỉnh sửa</button><p class="footer-note">Ghi nhận vào dữ liệu xem thử.</p>`);}catch(err){$('#bill-error').textContent=err.message;}}
function billDetail(id){const b=bills.find(b=>b.id===id);show(`<h2 class="sheet-title">${esc(b.title)}</h2><p class="sheet-sub">${b.date} · ${b.ids.length} thành viên tham gia</p><div class="hero-number"><small>Tổng hóa đơn</small><div class="money">${fmt(b.amount)}</div></div><div class="note">${b.source==='fund'?'Đã chi từ quỹ chung':b.source==='advance'?names[b.payer]+' ứng trước cho quỹ':names[b.payer]+' trả trước · Chia riêng'}</div><div class="detail-list">${Money.split(b.amount,b.ids).map(s=>`<div class="row"><span>${esc(names[s.id])}</span><strong>${fmt(s.amount)}</strong></div>`).join('')}</div>${b.receipt?`<img class="receipt-image" src="${b.receipt}" alt="Hóa đơn của khoản chi">`:'<div class="receipt-placeholder">Bill minh họa · Chưa có ảnh đính kèm</div>'}${feedbackPanel(b.id)}<p class="footer-note">Cả nhóm có thể xem chi tiết khoản này.</p>`);}
function contribute(){show(`<h2 class="sheet-title">Góp thêm một chút</h2><p class="sheet-sub">Nộp quỹ cho những cuộc vui tiếp theo.</p><form id="contribute-form"><label class="field">Số tiền nộp quỹ (₫)<input name="amount" class="amount" type="number" inputmode="numeric" min="1" max="100000000" step="1" value="500000" required></label><div class="bank-card"><div class="bank-logo">TÀI KHOẢN MINH HỌA</div><strong>DEMO • QUỸ NHÓM</strong><small>Thủ quỹ: ${esc(names[2])} · Chưa liên kết ngân hàng</small></div><div class="note">Trong ứng dụng thật, bạn sẽ chuyển tiền đến tài khoản quỹ rồi gửi minh chứng. Bản mẫu này chỉ thử trạng thái chờ xác nhận.</div><button class="primary" type="submit">Thử gửi yêu cầu nộp quỹ</button></form>`);$('#contribute-form').onsubmit=e=>{e.preventDefault();const amount=Number(e.target.amount.value);if(!Number.isSafeInteger(amount)||amount<=0||amount>100000000)return;pendingContributions.push({amount});close();go('fund');toast('Đã tạo yêu cầu mẫu, chờ thủ quỹ xác nhận.');};}
function transfer(from,to,amount){if(from!==0){show(`<h2 class="sheet-title">Khoản bạn được nhận</h2><p class="sheet-sub">${esc(names[from])} → Bạn</p><div class="money">${fmt(amount)}</div><div class="note">Người trả gửi xác nhận sau khi chuyển tiền. Bạn kiểm tra tài khoản trước khi xác nhận đã nhận.</div>`);return;}const pending=payments.some(p=>p.from===from&&p.to===to&&p.status==='pending');show(`<h2 class="sheet-title">Thanh toán cho ${esc(names[to])}</h2><p class="sheet-sub">Trả một phần hoặc toàn bộ khoản còn nợ.</p><form id="payment-form"><label class="field">Số tiền thanh toán (₫)<input class="amount" name="amount" type="number" inputmode="numeric" min="1" max="${amount}" step="1" value="${amount}" required></label><p class="sub">Tối đa ${fmt(amount)}</p><div class="bank-card"><div class="bank-logo">THÔNG TIN NHẬN TIỀN</div><strong>${names[to].toUpperCase()} · DEMO</strong><small>Chưa liên kết tài khoản ngân hàng</small><div class="row"><span>Nội dung</span><strong>CHUNG TRA ${names[to].toUpperCase()}</strong></div><button type="button" class="secondary" data-action="copy" data-copy="CHUNG TRA ${names[to].toUpperCase()}">Sao chép nội dung</button></div><label class="upload">${icon('upload')}<span>Ảnh chuyển khoản <small>(tùy chọn)</small><input name="proof" type="file" accept="image/*" aria-label="Ảnh chuyển khoản"></span></label><div class="note">Không chuyển tiền thật ở bản mẫu. Ảnh chuyển khoản cần người nhận kiểm tra; tải ảnh lên chưa đồng nghĩa đã thanh toán.</div><p class="error" id="payment-error"></p><button class="primary" type="submit" ${pending?'disabled':''}>${pending?'Đang chờ xác nhận':'Thử báo đã chuyển tiền'}</button></form>`);$('#payment-form').onsubmit=e=>{e.preventDefault();const n=Number(e.target.amount.value), file=e.target.proof.files[0];if(!Number.isSafeInteger(n)||n<=0||n>amount)return;if(file&&(!file.type.startsWith('image/')||file.size>10*1024*1024)){$('#payment-error').textContent='Chọn ảnh dưới 10 MB.';return;}payments.push({from,to,amount:n,status:'pending',proof:file?URL.createObjectURL(file):null});close();go('debts');toast('Đã gửi yêu cầu mẫu. Công nợ chưa thay đổi.');};}

function invitePreview(tab='overview'){
 try{const g=inviteContext(),s=g.access,l=s.links.find(l=>l.token===inviteToken);if(!l||l.revoked||l.expiresAt<=Date.now())throw Error('Link hết hạn hoặc đã thu hồi.');
 if(l.kind==='general'){show(`<h2 class="sheet-title">Yêu cầu tham gia nhóm</h2><p class="sheet-sub">Chưa được duyệt · Chưa có quyền xem dữ liệu</p><form id="join-form"><label class="field">Tên hiển thị<input name="displayName" required maxlength="60" value="Huy"></label><label class="field">Tài khoản mô phỏng<input name="account" required maxlength="80" value="huy-moi"></label><p class="note">Trong sản phẩm thật, danh tính lấy từ phiên đăng nhập; không nhập mã tài khoản bằng tay.</p><button class="primary">Mô phỏng đăng nhập & gửi yêu cầu</button></form>`);$('#join-form').onsubmit=e=>{e.preventDefault();try{const r=Membership.request(s,inviteToken,e.target.account.value.trim(),e.target.displayName.value);show(`<h2 class="sheet-title">Đang chờ trưởng nhóm</h2><p class="sheet-sub">${esc(r.name)} · Yêu cầu đã gửi</p><p class="note">Chưa tạo thêm thành viên và chưa mở dữ liệu nhóm.</p><button class="secondary" data-action="join-queue">Mô phỏng trưởng nhóm duyệt</button>`);}catch(err){inviteError(err);}};return;}
 const m=Membership.read(s,inviteToken),i=s.members.findIndex(x=>x.id===m.id),st=g.state,t=Money.personalDebts(st.bills,st.payments,st.names.length,i),f=fund();
 let content=tab==='overview'?`${contactTotals(t.owe,t.receive)}<h3>Thành viên</h3>${s.members.map(x=>`<p>${esc(x.name)} · ${x.id===m.id?'Bạn':x.accountId?'Có tài khoản':'Chưa đăng ký'}</p>`).join('')}`:tab==='fund'?`<div class="detail-list"><div class="row">Tiền trong quỹ <strong>${fmt(f.cash)}</strong></div><div class="row">Cần hoàn ứng <strong>${fmt(f.owed)}</strong></div><div class="row">Có thể chi <strong>${fmt(f.available)}</strong></div></div>${st.fundEvents.map(e=>`<p>${esc(e.title)} · ${fmt(e.amount)}</p>`).join('')}`:tab==='debts'?`${contactTotals(t.owe,t.receive)}<h3>Bạn nợ ai</h3>${t.owed.map(x=>`<p>${esc(st.names[x.to])}: ${fmt(x.amount)}</p>`).join('')||'<p>Không có khoản nợ.</p>'}<h3>Ai nợ bạn</h3>${t.receivable.map(x=>`<p>${esc(st.names[x.from])}: ${fmt(x.amount)}</p>`).join('')||'<p>Không có khoản cần thu.</p>'}`:`${st.bills.map(b=>`<details class="pending-card"><summary>${esc(b.title)} · ${fmt(b.amount)}</summary><p>${b.source==='fund'?'Chi quỹ':esc(st.names[b.payer])+' trả trước'} · ${b.source==='personal'?'Chia riêng':'Quỹ nhóm'}</p>${Money.split(b.amount,b.ids).map(x=>`<p>${esc(st.names[x.id])}: ${fmt(x.amount)}</p>`).join('')}</details>`).join('')}${st.payments.map(p=>`<p>${esc(st.names[p.from])} → ${esc(st.names[p.to])}: ${fmt(p.amount)} · ${esc(p.status)}</p>`).join('')}`;
 show(`<h2 class="sheet-title">${esc(g.name)}</h2><p class="sheet-sub">Đang xem với hồ sơ ${esc(m.name)} · Không cần đăng ký</p><div class="pill-tabs">${[['overview','Nhóm'],['fund','Quỹ'],['debts','Công nợ'],['activity','Bill & lịch sử']].map(([key,title])=>`<button class="${tab===key?'selected':''}" data-action="guest-tab" data-tab="${key}">${title}</button>`).join('')}</div>${content}<p class="note">Link riêng cho quyền xem trong nhóm này. Quyền sửa, xác nhận tiền và quản trị không tự cấp qua link.</p>${!m.accountId?'<button class="primary" data-action="claim-profile">Đăng ký & giữ hồ sơ này</button>':'<p class="sub">Hồ sơ đã có tài khoản.</p>'}<button class="secondary spaced" data-action="members">Thoát xem thử</button>`);
 }catch(err){show(`<h2 class="sheet-title">Không thể mở lời mời</h2><p class="note">${esc(err.message)}</p><button class="secondary" data-action="members">Về thành viên</button>`);}
}
function claimProfile(){show('<h2 class="sheet-title">Liên kết tài khoản</h2><p class="sheet-sub">Mô phỏng đăng ký · Giữ nguyên mã thành viên và công nợ</p><form id="claim-form"><label class="field">Tài khoản mô phỏng<input name="account" required maxlength="80" value="chi-moi"></label><button class="primary">Mô phỏng đăng nhập & liên kết</button></form>');$('#claim-form').onsubmit=e=>{e.preventDefault();try{const g=inviteContext();Membership.claim(g.access,inviteToken,e.target.account.value.trim());refreshMembers();members();toast('Đã liên kết; lịch sử giữ nguyên. Link khách cũ đã thu hồi.');}catch(err){inviteError(err);}};}
function joinQueue(){const g=accessGroup();show(`<h2 class="sheet-title">Trưởng nhóm duyệt</h2><p class="sheet-sub">Mô phỏng vai trò trưởng nhóm · Không tự ghép theo tên</p>${g.access.requests.map(r=>`<div class="pending-card"><h3>${esc(r.name)}</h3><p>Tài khoản: ${esc(r.accountId)} · ${r.status==='pending'?'Chờ duyệt':r.status==='approved'?'Đã duyệt':'Đã từ chối'}</p>${r.status==='pending'?`<label class="field">Liên kết vào<select id="target-${r.id}"><option value="" disabled selected>Chọn hồ sơ hoặc người mới</option><option value="new">Tạo thành viên mới</option>${g.access.members.filter(m=>!m.accountId).map(m=>`<option value="${m.id}">${esc(m.name)} · Hồ sơ ${g.access.members.indexOf(m)+1}</option>`).join('')}</select></label><button class="primary" data-action="join-approve" data-id="${r.id}">Duyệt yêu cầu</button><button class="text-btn" data-action="join-reject" data-id="${r.id}">Từ chối</button>`:''}</div>`).join('')||'<p class="empty">Không có yêu cầu.</p>'}<button class="secondary" data-action="members">Về thành viên</button>`);}
Object.assign(actions,{members,invite:()=>invitationView(),'invite-person':b=>invitationView('personal',b.dataset.id),'invite-general':()=>invitationView('general'),'invite-preview':()=>invitePreview(),'guest-tab':b=>invitePreview(b.dataset.tab),'claim-profile':claimProfile,'join-queue':joinQueue,'join-approve':b=>{try{const s=accessGroup().access;const target=$('#target-'+b.dataset.id).value;if(!target)throw Error('Hãy chọn hồ sơ hoặc tạo thành viên mới.');Membership.approve(s,b.dataset.id,target==='new'?null:target,s.leaderId);refreshMembers();joinQueue();}catch(err){inviteError(err);}},'join-reject':b=>{try{const s=accessGroup().access;Membership.reject(s,b.dataset.id,s.leaderId);joinQueue();}catch(err){inviteError(err);}},'invite-revoke':()=>{const s=inviteContext().access;Membership.revoke(s,inviteToken,s.leaderId);invitePreview();},'invite-expire':()=>{inviteContext().access.links.find(l=>l.token===inviteToken).expiresAt=0;invitePreview();}});
function openInviteHash(){if(!location.hash.startsWith('#invite/'))return;const parts=location.hash.slice(1).split('/');inviteGroupId=parts[1];inviteToken=parts[2];if(groups.some(g=>g.id===inviteGroupId)&&inviteGroupId!==activeGroupId)switchGroup(inviteGroupId);invitePreview();}
window.addEventListener('hashchange',openInviteHash);openInviteHash();
</script>
</body></html>
